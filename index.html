<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rrar Coffee Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Welcome Popup -->
  <div class="welcome" id="welcomeBox">
    <div class="welcome-content">
      <h2>☕ Welcome!</h2>
      <p>Enjoy the finest brews at Rrar Coffee Shop</p>
      <button id="welcomeBtn">OK</button>
    </div>
  </div>

  <header>
    <div class="logo">
      <span class="coffee-icon">☕</span>
      Rrar <span>Coffee Shop</span>
    </div>
  </header>

  <section class="hero">
    <h1>Fresh Coffee, Every Morning</h1>
    <p>Relax, refresh & enjoy the taste of perfection.</p>
    <button class="order-btn">Order Now</button>
  </section>

  <script>
    // Show welcome after page loads
    window.onload = function() {
      setTimeout(() => {
        document.getElementById("welcomeBox").classList.add("show");
      }, 2000);
    };

    // Slide out on button click
    document.getElementById("welcomeBtn").onclick = function() {
      document.getElementById("welcomeBox").classList.add("hide");
    };
  </script>

</body>
</html>
