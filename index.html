<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bevrea - Refresh Your World</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 🌟 Welcome Popup -->
  <div class="welcome" id="welcomeBox">
    <div class="welcome-content">
      <h2>🍹 Welcome to Bevrea!</h2>
      <p>Refreshing drinks made for every moment.</p>
      <button id="welcomeBtn">Explore</button>
    </div>
  </div>

  <!-- 🌟 HEADER + LOGO -->
  <header>
    <div class="logo">
      <span class="drink-icon">🍹</span>
      Bevrea
    </div>
  </header>

  <!-- 🌟 HERO Section -->
  <section class="hero">
    <h1>Refresh Your World</h1>
    <p>Discover drinks that boost your mood and energy.</p>
    <button class="order-btn">Shop Now</button>
  </section>

  <script>
    // Show popup after page loads
    window.onload = function() {
      setTimeout(() => {
        document.getElementById("welcomeBox").classList.add("show");
      }, 2000);
    };

    // Hide popup on click
    document.getElementById("welcomeBtn").onclick = function() {
      document.getElementById("welcomeBox").classList.add("hide");
    };
  </script>
<!-- 🛒 SHOP SECTION -->
<section class="shop">
  <h2>Our Best Drinks</h2>

  <div class="products">

    <!-- 🍹 Product 1 -->
    <div class="product-card">
      <img src="images/976708376469393.jpg" alt="Bevrea Special">
      <h3>Bevrea Special</h3>
      <p>₦2,000</p>
      <button>Add to Cart</button>
    </div>

    <!-- 🍹 Product 2 -->
    <div class="product-card">
      <img src="images/976708376469393.jpg" alt="Bevrea Energy">
      <h3>Bevrea Energy</h3>
      <p>₦3,500</p>
      <button>Add to Cart</button>
    </div>

    <!-- 🍹 Product 3 -->
    <div class="product-card">
      <img src="images/976708376469393.jpg" alt="Bevrea Smoothie">
      <h3>Bevrea Smoothie</h3>
      <p>₦4,000</p>
      <button>Add to Cart</button>
    </div>

  </div>
</section>

</body>
</html>
